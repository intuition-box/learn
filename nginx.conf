# The static site, as `pnpm build` writes it to out/. A page's address has no
# .html: /play is play.html, and a page can sit beside a folder of the same
# name, as docs.html beside docs/.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Behind Coolify's proxy, a redirect must not name this container's own
  # host and port.
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript
    application/json image/svg+xml;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Next's built assets carry a hash in their names, so they never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  error_page 404 /404.html;
}
